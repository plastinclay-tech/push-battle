<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>НУБОКЛИКЕР</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #070913;
            color: #f8fafc;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        /* Шапка */
        header {
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 1px solid #1e293b;
            padding: 12px;
            z-index: 10;
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            max-width: 400px;
            margin: 0 auto;
            gap: 10px;
        }

        .stat-card {
            background: #020617;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }

        .stat-label {
            font-size: 9px;
            text-transform: uppercase;
            color: #94a3b8;
            font-weight: 700;
        }

        .stat-value {
            font-size: 15px;
            font-weight: 900;
            color: #fbbf24;
        }

        /* Прогресс-бар */
        .progress-box {
            max-width: 400px;
            margin: 8px auto 0;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 4px;
            color: #cbd5e1;
        }

        .progress-bar-bg {
            background: #020617;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #1e293b;
        }

        .progress-bar-fill {
            background: linear-gradient(90deg, #d97706, #f59e0b, #fef08a);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Главная зона персонажа */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            position: relative;
            overflow-y: auto;
        }

        .tab-content {
            width: 100%;
            max-width: 400px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .hidden {
            display: none !important;
        }

        .tap-power-badge {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid #334155;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        /* Персонаж */
        .character-wrapper {
            position: relative;
            width: 220px;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin: my-auto;
        }

        .character-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
            transition: transform 0.05s ease;
        }

        .character-wrapper:active .character-svg {
            transform: scale(0.92);
        }

        .char-title {
            font-size: 20px;
            font-weight: 900;
            color: #fbbf24;
            text-align: center;
        }

        .char-subtitle {
            font-size: 11px;
            color: #64748b;
            text-align: center;
            margin-top: 2px;
        }

        /* Нижнее меню */
        nav {
            background: #0f172a;
            border-top: 1px solid #1e293b;
            padding: 8px 16px;
            display: flex;
            justify-content: space-around;
        }

        .nav-btn {
            background: none;
            border: none;
            color: #64748b;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
        }

        .nav-btn.active {
            color: #fbbf24;
        }

        .nav-icon {
            font-size: 20px;
        }

        /* Вылетающие цифры */
        .floating-text {
            position: absolute;
            animation: floatUp 0.8s ease-out forwards;
            pointer-events: none;
            font-weight: 900;
            font-size: 22px;
            color: #fbbf24;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            z-index: 100;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-70px) scale(1.2); }
        }

        /* Список в магазине/эволюции */
        .list-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-bottom: 20px;
        }

        .card {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-btn {
            background: #f59e0b;
            color: #020617;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 12px;
            cursor: pointer;
        }

        .card-btn:disabled {
            background: #334155;
            color: #64748b;
        }
    </style>
</head>
<body>

    <!-- Хэдер -->
    <header>
        <div class="stats-row">
            <div class="stat-card">
                <span style="font-size:20px;">🪙</span>
                <div>
                    <div class="stat-label">Монеты</div>
                    <div class="stat-value" id="coin-counter">0</div>
                </div>
            </div>
            <div class="stat-card">
                <span style="font-size:20px;">⚡</span>
                <div>
                    <div class="stat-label">Доход в сек</div>
                    <div class="stat-value" id="cps-counter" style="color:#60a5fa;">+0 /сек</div>
                </div>
            </div>
        </div>

        <div class="progress-box">
            <div class="progress-info">
                <span id="header-form-name">1. Обычный нуб</span>
                <span id="header-form-percent" style="color:#fbbf24;">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="evolution-progress-bar"></div>
            </div>
        </div>
    </header>

    <!-- Основной контент -->
    <main>
        <!-- Вкладка Кликера -->
        <div id="tab-clicker" class="tab-content">
            <div class="tap-power-badge">Сила тапа: <span id="tap-power-display" style="color:#fbbf24;">+1</span></div>

            <!-- SVG Интерактивный Персонаж -->
            <div class="character-wrapper" id="click-target">
                <svg id="character-svg" class="character-svg" viewBox="0 0 200 200">
                    <!-- Рендерится через JS -->
                </svg>
            </div>

            <div>
                <div class="char-title" id="current-form-title">Обычный нуб</div>
                <div class="char-subtitle">Нажимай на персонажа!</div>
            </div>
        </div>

        <!-- Вкладка Магазина -->
        <div id="tab-shop" class="tab-content hidden" style="justify-content: flex-start;">
            <h3 style="margin-bottom: 15px; color: #fbbf24;">🛒 Магазин улучшений</h3>
            <div class="list-container" id="shop-items-container"></div>
        </div>

        <!-- Вкладка Эволюции -->
        <div id="tab-evolution" class="tab-content hidden" style="justify-content: flex-start;">
            <h3 style="margin-bottom: 15px; color: #a855f7;">🧬 Галерея Эволюции</h3>
            <div class="list-container" id="evolution-list-container"></div>
        </div>
    </main>

    <!-- Навигация -->
    <nav>
        <button class="nav-btn active" onclick="switchTab('clicker')" id="nav-clicker">
            <span class="nav-icon">👆</span>
            <span>Тап</span>
        </button>
        <button class="nav-btn" onclick="switchTab('shop')" id="nav-shop">
            <span class="nav-icon">🛒</span>
            <span>Магазин</span>
        </button>
        <button class="nav-btn" onclick="switchTab('evolution')" id="nav-evolution">
            <span class="nav-icon">🧬</span>
            <span>Эволюция</span>
        </button>
    </nav>

    <script>
        let game = {
            coins: 0,
            totalCoinsEarned: 0,
            totalTaps: 0,
            tapPowerLevel: 0,
            brainLevel: 0,
            botLevel: 0,
            unlockedForms: [0]
        };

        // Векторные шаблоны 4 персонажей
        const NOOB_FORMS = [
            {
                id: 0, name: "1. Обычный нуб", cost: 0,
                svg: `
                    <rect x="65" y="80" width="70" height="60" fill="#2563eb" rx="5"/>
                    <rect x="70" y="140" width="25" height="50" fill="#059669" rx="3"/>
                    <rect x="105" y="140" width="25" height="50" fill="#059669" rx="3"/>
                    <rect x="40" y="85" width="20" height="50" fill="#facc15" rx="3"/>
                    <rect x="140" y="85" width="20" height="50" fill="#facc15" rx="3"/>
                    <rect x="55" y="25" width="90" height="60" fill="#facc15" rx="8" stroke="#ca8a04" stroke-width="3"/>
                    <circle cx="80" cy="50" r="8" fill="#fff"/><circle cx="82" cy="50" r="4" fill="#000"/>
                    <circle cx="120" cy="48" r="8" fill="#fff"/><circle cx="122" cy="48" r="4" fill="#000"/>
                    <path d="M 85 65 Q 100 80 115 65" stroke="#000" stroke-width="4" fill="none" stroke-linecap="round"/>
                    <polygon points="75,25 70,5 88,18 100,2 112,18 130,5 125,25" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
                `
            },
            {
                id: 1, name: "2. Нуб-Горилла", cost: 5000,
                svg: `
                    <rect x="45" y="70" width="110" height="75" fill="#1e293b" rx="10"/>
                    <rect x="60" y="145" width="35" height="45" fill="#78350f" rx="5"/>
                    <rect x="105" y="145" width="35" height="45" fill="#78350f" rx="5"/>
                    <rect x="20" y="75" width="25" height="65" fill="#78350f" rx="5"/>
                    <rect x="155" y="75" width="25" height="65" fill="#78350f" rx="5"/>
                    <rect x="50" y="20" width="100" height="55" fill="#eab308" rx="8"/>
                    <rect x="68" y="38" width="20" height="8" fill="#000"/>
                    <rect x="112" y="38" width="20" height="8" fill="#000"/>
                    <line x1="65" y1="30" x2="90" y2="36" stroke="#000" stroke-width="4"/>
                    <line x1="135" y1="30" x2="110" y2="36" stroke="#000" stroke-width="4"/>
                    <rect x="75" y="58" width="50" height="6" fill="#000"/>
                    <rect x="165" y="40" width="12" height="80" fill="#451a03" rx="3" transform="rotate(15 165 40)"/>
                `
            },
            {
                id: 2, name: "3. Нуб-Демон", cost: 100000,
                svg: `
                    <path d="M 60 90 L 10 50 L 30 110 Z" fill="#991b1b"/>
                    <path d="M 140 90 L 190 50 L 170 110 Z" fill="#991b1b"/>
                    <rect x="55" y="75" width="90" height="70" fill="#7f1d1d" rx="8"/>
                    <rect x="65" y="145" width="28" height="45" fill="#450a0a" rx="4"/>
                    <rect x="107" y="145" width="28" height="45" fill="#450a0a" rx="4"/>
                    <polygon points="65,25 45,0 75,20" fill="#450a0a"/>
                    <polygon points="135,25 155,0 125,20" fill="#450a0a"/>
                    <rect x="50" y="20" width="100" height="60" fill="#b91c1c" rx="8"/>
                    <rect x="70" y="42" width="16" height="8" fill="#fef08a"/>
                    <rect x="114" y="42" width="16" height="8" fill="#fef08a"/>
                    <path d="M 80 62 Q 100 75 120 62" stroke="#000" stroke-width="4" fill="none"/>
                `
            },
            {
                id: 3, name: "4. Золотой Император", cost: 1000000,
                svg: `
                    <path d="M 50 80 L 0 30 L 25 110 Z" fill="#fef08a"/>
                    <path d="M 150 80 L 200 30 L 175 110 Z" fill="#fef08a"/>
                    <rect x="55" y="70" width="90" height="75" fill="#b45309" rx="8"/>
                    <rect x="65" y="80" width="70" height="55" fill="#fbbf24" rx="5"/>
                    <rect x="65" y="145" width="28" height="45" fill="#d97706" rx="4"/>
                    <rect x="107" y="145" width="28" height="45" fill="#d97706" rx="4"/>
                    <rect x="48" y="18" width="104" height="60" fill="#fde047" rx="8" stroke="#ca8a04" stroke-width="3"/>
                    <rect x="70" y="40" width="14" height="12" fill="#000"/>
                    <rect x="116" y="40" width="14" height="12" fill="#000"/>
                    <polygon points="50,18 45,-10 70,5 100,-15 130,5 155,-10 150,18" fill="#fef08a" stroke="#d97706" stroke-width="2"/>
                `
            }
        ];

        const SHOP_ITEMS = [
            { id: 'tapPower', name: 'Железный палец', desc: '+1 за клик', baseCost: 15, mult: 1.5 },
            { id: 'brain', name: 'Мозг нуба', desc: '+1 монета/сек', baseCost: 100, mult: 1.6 },
            { id: 'bot', name: 'Нубо-бот', desc: '+5 монет/сек', baseCost: 500, mult: 1.7 }
        ];

        function getTapPower() {
            return 1 + game.tapPowerLevel;
        }

        function getCPS() {
            return (game.brainLevel * 1) + (game.botLevel * 5);
        }

        function getCurrentFormIndex() {
            let idx = 0;
            for (let i = 0; i < NOOB_FORMS.length; i++) {
                if (game.totalCoinsEarned >= NOOB_FORMS[i].cost) idx = i;
            }
            return idx;
        }

        // Обновление всей графики и персонажа
        function updateUI() {
            document.getElementById('coin-counter').innerText = Math.floor(game.coins).toLocaleString();
            document.getElementById('cps-counter').innerText = `+${getCPS()} /сек`;
            document.getElementById('tap-power-display').innerText = `+${getTapPower()}`;

            let currentIdx = getCurrentFormIndex();
            let form = NOOB_FORMS[currentIdx];

            document.getElementById('current-form-title').innerText = form.name;
            document.getElementById('header-form-name').innerText = form.name;
            document.getElementById('character-svg').innerHTML = form.svg;

            let nextForm = NOOB_FORMS[currentIdx + 1];
            let percent = 100;
            if (nextForm) {
                percent = Math.min(100, Math.max(0, ((game.totalCoinsEarned - form.cost) / (nextForm.cost - form.cost)) * 100));
            }
            document.getElementById('header-form-percent').innerText = `${Math.floor(percent)}%`;
            document.getElementById('evolution-progress-bar').style.width = `${percent}%`;
        }

        // Клик по персонажу
        const clickTarget = document.getElementById('click-target');
        
        function handleTap(e) {
            e.preventDefault();
            let power = getTapPower();
            game.coins += power;
            game.totalCoinsEarned += power;
            game.totalTaps++;

            // Вылетающие цифры
            let rect = clickTarget.getBoundingClientRect();
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;

            let text = document.createElement('div');
            text.className = 'floating-text';
            text.innerText = `+${power}`;
            text.style.left = `${clientX - rect.left}px`;
            text.style.top = `${clientY - rect.top}px`;
            clickTarget.appendChild(text);

            setTimeout(() => text.remove(), 800);

            updateUI();
        }

        clickTarget.addEventListener('touchstart', handleTap, {passive: false});
        clickTarget.addEventListener('click', handleTap);

        // Навигация
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

            document.getElementById(`tab-${tabId}`).classList.remove('hidden');
            document.getElementById(`nav-${tabId}`).classList.add('active');

            if (tabId === 'shop') renderShop();
            if (tabId === 'evolution') renderEvolution();
        }

        function renderShop() {
            let container = document.getElementById('shop-items-container');
            container.innerHTML = '';
            SHOP_ITEMS.forEach(item => {
                let lvl = item.id === 'tapPower' ? game.tapPowerLevel : (item.id === 'brain' ? game.brainLevel : game.botLevel);
                let cost = Math.floor(item.baseCost * Math.pow(item.mult, lvl));
                let canAfford = game.coins >= cost;

                let card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div>
                        <div style="font-weight:800;">${item.name} (Ур. ${lvl})</div>
                        <div style="font-size:11px; color:#94a3b8;">${item.desc}</div>
                    </div>
                    <button class="card-btn" ${canAfford ? '' : 'disabled'} onclick="buyUpgrade('${item.id}', ${cost})">
                        🪙 ${cost}
                    </button>
                `;
                container.appendChild(card);
            });
        }

        function buyUpgrade(id, cost) {
            if (game.coins >= cost) {
                game.coins -= cost;
                if (id === 'tapPower') game.tapPowerLevel++;
                if (id === 'brain') game.brainLevel++;
                if (id === 'bot') game.botLevel++;
                renderShop();
                updateUI();
            }
        }

        function renderEvolution() {
            let container = document.getElementById('evolution-list-container');
            container.innerHTML = '';
            let currentIdx = getCurrentFormIndex();

            NOOB_FORMS.forEach((form, idx) => {
                let isCurrent = idx === currentIdx;
                let isUnlocked = game.totalCoinsEarned >= form.cost;

                let card = document.createElement('div');
                card.className = 'card';
                card.style.opacity = isUnlocked ? '1' : '0.5';
                card.innerHTML = `
                    <div>
                        <div style="font-weight:800;">${form.name} ${isCurrent ? '⭐' : ''}</div>
                        <div style="font-size:11px; color:#94a3b8;">${isUnlocked ? 'Разблокировано' :
