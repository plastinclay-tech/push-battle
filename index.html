<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pushup Legends</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Библиотеки MediaPipe Pose -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            touch-action: manipulation;
            min-height: 100dvh;
            margin: 0;
            box-sizing: border-box;
        }
        .boss-shake {
            animation: shake 0.3s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translate(0, 0); }
            20% { transform: translate(-8px, 4px); }
            40% { transform: translate(8px, -4px); }
            60% { transform: translate(-6px, -2px); }
            80% { transform: translate(6px, 2px); }
        }
        .damage-float {
            position: absolute;
            animation: floatUp 0.8s ease-out forwards;
            pointer-events: none;
            font-weight: 900;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.8); }
            100% { opacity: 0; transform: translateY(-70px) scale(1.3); }
        }
    </style>
</head>
<body class="flex flex-col justify-between min-h-[100dvh] p-3 select-none">

    <!-- ВЕРХНЯЯ ПАНЕЛЬ: БОСС И ЗДОРОВЬЕ -->
    <div id="battleHeader" class="w-full bg-slate-900/90 border border-slate-800 rounded-xl p-3 shadow-xl backdrop-blur-md shrink-0">
        <div class="flex justify-between items-center mb-1.5">
            <div>
                <h1 id="bossName" class="text-base font-bold tracking-wide text-red-400">🌿 Терновый Слизень</h1>
                <p id="bossLevelText" class="text-[11px] text-slate-400">Этап 2 — Солнечный луг</p>
            </div>
            <div class="text-right">
                <span id="bossHpText" class="text-lg font-black text-red-500">66</span>
                <span id="bossMaxHpText" class="text-[11px] text-slate-500">/ 66 HP</span>
            </div>
        </div>

        <!-- Полоса здоровья босса -->
        <div class="w-full bg-slate-800 h-3 rounded-full overflow-hidden p-0.5 border border-slate-700/50">
            <div id="bossHpBar" class="bg-gradient-to-r from-red-600 to-amber-500 h-full rounded-full transition-all duration-300" style="width: 100%;"></div>
        </div>
    </div>

    <!-- ЦЕНТРАЛЬНАЯ ЧАСТЬ: ВИДЕО И АВАТАР -->
    <div id="gameContainer" class="relative flex-1 my-2 flex items-center justify-center bg-slate-950 rounded-xl overflow-hidden border border-slate-800 shadow-inner min-h-[260px]">
        <!-- Аватар босса (в режиме ожидания/подготовки) -->
        <div id="bossAvatar" class="absolute inset-0 flex flex-col items-center justify-center p-4 text-center z-10 transition-opacity duration-300">
            <div class="w-24 h-24 bg-emerald-950/40 rounded-full flex items-center justify-center border-2 border-emerald-600/50 mb-3 shadow-[0_0_20px_rgba(16,185,129,0.2)]">
                <span class="text-5xl">🟢</span>
            </div>
            <p id="statusMsg" class="text-xs text-slate-300 font-medium max-w-[240px]">Запуск камеры...</p>
        </div>

        <!-- Видео с камеры -->
        <video id="webcam" autoplay playsinline muted class="absolute inset-0 w-full h-full object-cover transform -scale-x-100 opacity-0 transition-opacity duration-500"></video>
        
        <!-- Холст скелета (зелёная сетка как на референсе) -->
        <canvas id="outputCanvas" class="absolute inset-0 w-full h-full object-cover transform -scale-x-100 pointer-events-none z-20"></canvas>

        <!-- Всплывающий урон -->
        <div id="floatingContainer" class="absolute inset-0 pointer-events-none z-30 overflow-hidden"></div>
    </div>

    <!-- ЭКРАН ПОБЕДЫ (СКРЫТ ПО УМОЛЧАНИЮ) -->
    <div id="victoryScreen" class="absolute inset-0 bg-slate-950/95 z-50 flex flex-col items-center justify-center p-6 text-center hidden">
        <div class="w-20 h-20 bg-amber-500/20 rounded-full flex items-center justify-center border-2 border-amber-500 mb-4 animate-bounce">
            <span class="text-4xl">🏆</span>
        </div>
        <h2 class="text-2xl font-black text-amber-400 mb-1">ПОБЕДА</h2>
        <p id="victoryTitle" class="text-sm text-slate-300 mb-4">Цветущий Грибник повержен!</p>
        
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 w-full max-w-xs mb-4 flex justify-around text-center">
            <div>
                <p id="vicPushups" class="text-lg font-black text-amber-400">3</p>
                <p class="text-[10px] text-slate-400 uppercase">Отжимания</p>
            </div>
            <div>
                <p id="vicTime" class="text-lg font-black text-blue-400">0:16</p>
                <p class="text-[10px] text-slate-400 uppercase">Время</p>
            </div>
            <div>
                <p id="vicXp" class="text-lg font-black text-emerald-400">+76</p>
                <p class="text-[10px] text-slate-400 uppercase">XP</p>
            </div>
        </div>

        <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-3 w-full max-w-xs mb-6 text-left">
            <p class="text-[10px] text-slate-400 uppercase mb-1">Добыча — Обычный</p>
            <p class="text-sm font-bold text-indigo-300">✨ Счастливый камешек</p>
            <p class="text-[11px] text-slate-500">АТК 0 / ЗАЩ 0 / КРИТ 3%</p>
        </div>

        <button onclick="nextQuest()" class="w-full max-w-xs bg-gradient-to-r from-amber-500 to-yellow-600 font-bold text-slate-950 py-3 rounded-xl shadow-lg active:scale-95 transition-all text-sm">
            Продолжить квест
        </button>
    </div>

    <!-- НИЖНЯЯ ПАНЕЛЬ СЧЁТЧИКА -->
    <div class="w-full bg-slate-900/90 border border-slate-800 rounded-xl p-3 shadow-xl backdrop-blur-md flex flex-col gap-2 shrink-0">
        <div class="flex justify-between items-center bg-slate-950/60 px-3 py-2 rounded-lg border border-slate-800/80">
            <div class="flex items-center gap-2">
                <span class="text-lg">💪</span>
                <span id="pushupCount" class="text-xl font-black text-amber-400">0</span>
                <span class="text-[11px] text-slate-400">повторов</span>
            </div>
            <button id="calibBtn" onclick="startCalibration()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs px-3 py-1.5 rounded-lg transition-all shadow">
                🎯 Калибровка
            </button>
        </div>
        <div class="text-center">
            <span id="statusSubMsg" class="text-[11px] text-slate-400">Поставьте телефон на пол и нажмите калибровку</span>
        </div>
    </div>

    <!-- ЛОГИКА ИИ И ИГРЫ -->
    <script>
        let bossLevel = 1;
        let maxHp = 66;
        let currentHp = 66;
        let pushups = 0;
        let startTime = null;
        
        let pose = null;
        let camera = null;
        let webcamRunning = false;
        let isReadyToFight = false;
        let isCalibrating = false;

        // Калибровочные переменные под конкретного пользователя
        let calibMinAngle = 180;
        let calibMaxAngle = 0;
        let userBottomThreshold = 100;
        let userTopThreshold = 120;
        let calibStage = 0; // 0 - ждем нижнюю точку, 1 - ждем верхнюю

        let videoElement = document.getElementById("webcam");
        let canvasElement = document.getElementById("outputCanvas");
        let canvasCtx = canvasElement.getContext("2d");

        let pushupState = 0; // 0 = ВЕРХ, 1 = ВНИЗ
        let lastStateChangeTime = 0;
        let smoothedAngle = 180;

        const bosses = [
            { name: "Терновый Слизень", emoji: "🟢", hp: 66, desc: "Этап 2 — Солнечный луг", loot: "Тканевые обмотки" },
            { name: "Цветущий Грибник", emoji: "🍄", hp: 100, desc: "Этап 3 — Лесная опушка", loot: "Счастливый камешек" },
            { name: "Огненный Голем", emoji: "🔥", hp: 150, desc: "Этап 4 — Вулканическая пещера", loot: "Угрюмый щит" }
        ];

        function initPose() {
            if (typeof Pose === "undefined") return;

            pose = new Pose({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
            });

            pose.setOptions({
                modelComplexity: 1,
                smoothLandmarks: true,
                minDetectionConfidence: 0.35,
                minTrackingConfidence: 0.35
            });

            pose.onResults(onPoseResults);
        }

        // Автозапуск камеры сразу при открытии страницы без лишних кнопок
        async function autoStartCamera() {
            try {
                if (!pose) initPose();

                camera = new Camera(videoElement, {
                    onFrame: async () => {
                        if (webcamRunning && pose) {
                            try { await pose.send({ image: videoElement }); } catch(e){}
                        }
                    },
                    width: 640,
                    height: 480
                });

                await camera.start();
                webcamRunning = true;
                
                videoElement.classList.remove("opacity-0");
                document.getElementById("bossAvatar").classList.add("opacity-0");
                document.getElementById("statusMsg").innerText = "Примите упор лёжа и нажмите «Калибровка»";

            } catch (err) {
                console.error("Ошибка камеры:", err);
                alert("Разрешите доступ к камере в браузере.");
            }
        }

        function startCalibration() {
            if (!webcamRunning) return;
            isCalibrating = true;
            isReadyToFight = false;
            calibMinAngle = 180;
            calibMaxAngle = 0;
            calibStage = 0;
            
            document.getElementById("statusMsg").innerText = "🎯 Сделайте 1 полное отжимание для калибровки!";
            document.getElementById("statusSubMsg").innerText = "Опуститесь вниз и поднимитесь обратно";
            document.getElementById("calibBtn").innerText = "Идет калибровка...";
            document.getElementById("calibBtn").classList.add("animate-pulse", "bg-amber-600");
        }

        function onPoseResults(results) {
            if (!webcamRunning) return;

            canvasElement.width = videoElement.videoWidth || 640;
            canvasElement.height = videoElement.videoHeight || 480;

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            if (results.poseLandmarks) {
                const lm = results.poseLandmarks;
                
                const ls = lm[11], rs = lm[12]; // Плечи
                const le = lm[13], re = lm[14]; // Локти
                const lw = lm[15], rw = lm[16]; // Запястья

                const isVisible = ls && rs && le && re && lw && rw &&
                                  ls.visibility > 0.2 && rs.visibility > 0.2;

                if (isVisible) {
                    // Отрисовка фирменной зеленой сетки скелета
                    drawGreenSkeleton(lm);

                    const leftAngle = calculateAngle(ls, le, lw);
                    const rightAngle = calculateAngle(rs, re, rw);
                    const rawAngle = (leftAngle + rightAngle) / 2;

                    // Сглаживание углов
                    smoothedAngle = smoothedAngle === 180 ? rawAngle : (smoothedAngle * 0.4 + rawAngle * 0.6);

                    // Режим калибровки по 1 отжиманию
                    if (isCalibrating) {
                        processCalibration(smoothedAngle);
                        canvasCtx.restore();
                        return;
                    }

                    // Боевой режим после успешной калибровки
                    if (isReadyToFight) {
                        document.getElementById("statusSubMsg").innerText = "🔥 Бой идет! Отжимайтесь глубоко!";
                        processPushupState(smoothedAngle);
                    }
                } else {
                    if (isReadyToFight) {
                        document.getElementById("statusSubMsg").innerText = "⚠️ Держите руки и плечи в кадре телефона!";
                    }
                }
            }
            canvasCtx.restore();
        }

        function processCalibration(angle) {
            if (angle < calibMinAngle) calibMinAngle = angle;
            if (angle > calibMaxAngle) calibMaxAngle = angle;

            if (calibStage === 0 && angle < 110) {
                calibStage = 1;
                document.getElementById("statusMsg").innerText = "⬇️ Отлично! Теперь поднимайтесь вверх...";
            } else if (calibStage === 1 && angle > 120) {
                // Успешная калибровка под индивидуальную амплитуду
                userBottomThreshold = Math.min(Math.max(calibMinAngle + 6, 85), 110);
                userTopThreshold = Math.max(Math.min(calibMaxAngle - 6, 135), 115);

                isCalibrating = false;
                isReadyToFight = true;
                startTime = Date.now();

                document.getElementById("statusMsg").innerText = "⚔️ БИТВА НАЧАЛАСЬ!";
                document.getElementById("calibBtn").innerText = "Откалибровано ✓";
                document.getElementById("calibBtn").classList.remove("animate-pulse", "bg-amber-600");
                document.getElementById("calibBtn").classList.add("bg-emerald-700");
            }
        }

        function calculateAngle(a, b, c) {
            if (!a || !b || !c) return 180;
            let radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
            let angle = Math.abs(radians * 180.0 / Math.PI);
            if (angle > 180.0) angle = 360.0 - angle;
            return angle;
        }

        // Фирменная зелёная сетка скелета как в референсном приложении
        function drawGreenSkeleton(lm) {
            const color = isCalibrating ? "#eab308" : (pushupState === 1 ? "#ef4444" : "#10b981");

            const connections = [
                [lm[11], lm[12]], // Плечевой пояс
                [lm[11], lm[13]], [lm[13], lm[15]], // Левая рука
                [lm[12], lm[14]], [lm[14], lm[16]], // Правая рука
                [lm[11], lm[23]], [lm[12], lm[24]], [lm[23], lm[24]] // Корпус и бёдра
            ];

            if (lm[25] && lm[26]) {
                connections.push([lm[23], lm[25]], [lm[24], lm[26]]);
            }

            canvasCtx.lineWidth = 3;
            canvasCtx.strokeStyle = color;

            connections.forEach(([p1, p2]) => {
                if (p1 && p2 && (p1.visibility === undefined || p1.visibility > 0.2) && (p2.visibility === undefined || p2.visibility > 0.2)) {
                    canvasCtx.beginPath();
                    canvasCtx.moveTo(p1.x * canvasElement.width, p1.y * canvasElement.height);
                    canvasCtx.lineTo(p2.x * canvasElement.width, p2.y * canvasElement.height);
                    canvasCtx.stroke();
                }
            });

            const joints = [11, 12, 13, 14, 15, 16, 23, 24];
            if (lm[25]) joints.push(25, 26);

            joints.forEach(idx => {
                let p = lm[idx];
                if (p && (p.visibility === undefined || p.visibility > 0.2)) {
                    canvasCtx.beginPath();
                    canvasCtx.arc(p.x * canvasElement.width, p.y * canvasElement.height, 4, 0, 2 * Math.PI);
                    canvasCtx.fillStyle = "#ffffff";
                    canvasCtx.fill();
                }
            });
        }

        function processPushupState(angle) {
            const now = Date.now();
            const cooldown = 350;

            if (angle > userTopThreshold) {
                if (pushupState === 1 && (now - lastStateChangeTime > cooldown)) {
                    pushupState = 0;
                    lastStateChangeTime = now;
                    triggerHit(16); // Урон боссу за отжимание
                    return;
                }
                pushupState = 0;
            } else if (angle < userBottomThreshold) {
                pushupState = 1;
            }
        }

        function triggerHit(damageAmount) {
            currentHp -= damageAmount;
            if (currentHp < 0) currentHp = 0;

            pushups++;
            document.getElementById("pushupCount").innerText = pushups;

            updateBossUI();
            triggerEffects(`-${damageAmount}`);

            if (currentHp === 0) {
                isReadyToFight = false;
                showVictoryScreen();
            }
        }

        function manualHit() {
            if (!isReadyToFight) {
                // Если бой еще не начат, тестовый удар тоже засчитывает калибровку
                isReadyToFight = true;
                startTime = Date.now();
                document.getElementById("statusMsg").innerText = "⚔️ БИТВА НАЧАЛАСЬ!";
            }
            triggerHit(16);
        }

        function updateBossUI() {
            const hpBar = document.getElementById("bossHpBar");
            const hpText = document.getElementById("bossHpText");
            const percentage = (currentHp / maxHp) * 100;
            
            hpBar.style.width = percentage + "%";
            hpText.innerText = currentHp;
        }

        function triggerEffects(text) {
            const container = document.getElementById("gameContainer");
            container.classList.add("boss-shake");
            setTimeout(() => container.classList.remove("boss-shake"), 300);

            const floatCont = document.getElementById("floatingContainer");
            const dmgEl = document.createElement("div");
            dmgEl.className = "damage-float text-red-500 text-2xl";
            dmgEl.innerText = text;
            dmgEl.style.left = Math.random() * 50 + 25 + "%";
            dmgEl.style.top = Math.random() * 30 + 30 + "%";
            floatCont.appendChild(dmgEl);

            setTimeout(() => dmgEl.remove(), 800);
        }

        function showVictoryScreen() {
            const elapsedTime = Math.round((Date.now() - startTime) / 1000);
            const minutes = Math.floor(elapsedTime / 60);
            const seconds = elapsedTime % 60;
            const timeString = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;

            document.getElementById("vicPushups").innerText = pushups;
            document.getElementById("vicTime").innerText = timeString;
            document.getElementById("vicXp").innerText = "+" + (pushups * 25);
            document.getElementById("victoryTitle").innerText = bosses[(bossLevel - 1) % bosses.length].name + " повержен!";
            document.getElementById("victoryScreen").classList.remove("hidden");
        }

        function nextQuest() {
            bossLevel++;
            let bIndex = (bossLevel - 1) % bosses.length;
            maxHp = bosses[bIndex].hp;
            currentHp = maxHp;

            document.getElementById("bossName").innerText = bosses[bIndex].emoji + " " + bosses[bIndex].name;
            document.getElementById("bossLevelText").innerText = bosses[bIndex].desc;
            document.getElementById("bossMaxHpText").innerText = "/ " + maxHp + " HP";
            
            updateBossUI();
            document.getElementById("victoryScreen").classList.add("hidden");
            isReadyToFight = true;
            startTime = Date.now();
        }

        window.addEventListener("DOMContentLoaded", () => {
            autoStartCamera();
        });
    </script>
</body>
</html>
