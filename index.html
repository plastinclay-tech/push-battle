<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Push Battle RPG</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Стабильные библиотеки MediaPipe Pose -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            touch-action: manipulation;
            min-height: 100dvh;
            margin: 0;
            box-sizing: border-box;
        }
        .boss-shake {
            animation: shake 0.3s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translate(0, 0); }
            20% { transform: translate(-8px, 4px); }
            40% { transform: translate(8px, -4px); }
            60% { transform: translate(-6px, -2px); }
            80% { transform: translate(6px, 2px); }
        }
        .damage-float {
            position: absolute;
            animation: floatUp 0.8s ease-out forwards;
            pointer-events: none;
            font-weight: 900;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.8); }
            100% { opacity: 0; transform: translateY(-70px) scale(1.3); }
        }
    </style>
</head>
<body class="flex flex-col justify-between min-h-[100dvh] p-3 select-none">

    <!-- ВЕРХНЯЯ ЧАСТЬ: ИНФОРМАЦИЯ О БОССЕ -->
    <div class="w-full bg-slate-900/90 border border-slate-800 rounded-xl p-3 shadow-xl backdrop-blur-md shrink-0">
        <div class="flex justify-between items-center mb-1.5">
            <div>
                <h1 id="bossName" class="text-base font-bold tracking-wide text-red-400">👹 Сквернословный Орк</h1>
                <p id="bossLevelText" class="text-[11px] text-slate-400">Босс уровня 1</p>
            </div>
            <div class="text-right">
                <span id="bossHpText" class="text-lg font-black text-red-500">100</span>
                <span id="bossMaxHpText" class="text-[11px] text-slate-500">/ 100 HP</span>
            </div>
        </div>

        <!-- Полоса здоровья босса -->
        <div class="w-full bg-slate-800 h-3 rounded-full overflow-hidden p-0.5 border border-slate-700/50">
            <div id="bossHpBar" class="bg-gradient-to-r from-red-600 to-amber-500 h-full rounded-full transition-all duration-300" style="width: 100%;"></div>
        </div>
    </div>

    <!-- ЦЕНТРАЛЬНАЯ ЧАСТЬ: ВИДЕО КАМЕРЫ И АВАТАР БОССА -->
    <div id="gameContainer" class="relative flex-1 my-2.5 flex items-center justify-center bg-slate-950 rounded-xl overflow-hidden border border-slate-800 shadow-inner min-h-[220px]">
        <!-- Аватар босса -->
        <div id="bossAvatar" class="absolute inset-0 flex flex-col items-center justify-center p-4 text-center z-10 transition-opacity duration-300">
            <div id="bossEmoji" class="w-24 h-24 bg-red-950/40 rounded-full flex items-center justify-center border-2 border-red-600/50 mb-3 shadow-[0_0_20px_rgba(239,68,68,0.2)]">
                <span class="text-5xl">👹</span>
            </div>
            <p id="statusMsg" class="text-xs text-slate-400 font-medium max-w-[240px]">Нажмите «Камера» для старта</p>
        </div>

        <!-- Видеопоток с камеры -->
        <video id="webcam" autoplay playsinline muted class="absolute inset-0 w-full h-full object-cover transform -scale-x-100 opacity-0 transition-opacity duration-500"></video>
        
        <!-- Холст для скелета ИИ -->
        <canvas id="outputCanvas" class="absolute inset-0 w-full h-full object-cover transform -scale-x-100 pointer-events-none z-20"></canvas>

        <!-- Контейнер для вылетающего урона -->
        <div id="floatingContainer" class="absolute inset-0 pointer-events-none z-30 overflow-hidden"></div>
    </div>

    <!-- НИЖНЯЯ ПАНЕЛЬ: СЧЁТЧИК И УПРАВЛЕНИЕ -->
    <div class="w-full bg-slate-900/90 border border-slate-800 rounded-xl p-3 shadow-xl backdrop-blur-md flex flex-col gap-2 shrink-0">
        
        <!-- Статистика отжиманий -->
        <div class="flex justify-between items-center bg-slate-950/60 px-3 py-2 rounded-lg border border-slate-800/80">
            <div class="flex items-center gap-2">
                <span class="text-lg">💪</span>
                <span class="text-[11px] text-slate-400 uppercase tracking-wider font-semibold">Отжимания</span>
            </div>
            <div class="flex items-center gap-2">
                <span id="pushupCount" class="text-xl font-black text-amber-400">0</span>
                <span id="poseStateText" class="text-[10px] px-2 py-0.5 bg-slate-800 rounded text-slate-400 font-mono">ОЖИДАНИЕ</span>
            </div>
        </div>

        <!-- Кнопки управления -->
        <div class="grid grid-cols-2 gap-2">
            <button id="camBtn" onclick="toggleCamera()" class="bg-gradient-to-r from-blue-600 to-indigo-600 active:scale-95 text-white font-bold py-2.5 px-3 rounded-lg shadow-md transition-all text-xs flex items-center justify-center gap-1.5">
                <span>📷</span> Камера
            </button>
            <button onclick="manualHit()" class="bg-gradient-to-r from-red-600 to-rose-600 active:scale-95 text-white font-bold py-2.5 px-3 rounded-lg shadow-md transition-all text-xs flex items-center justify-center gap-1.5">
                <span>💥</span> Тест урон
            </button>
        </div>
    </div>

    <!-- ЛОГИКА ИГРЫ И AI -->
    <script>
        let bossLevel = 1;
        let maxHp = 100;
        let currentHp = 100;
        let pushups = 0;
        
        let pose = null;
        let camera = null;
        let webcamRunning = false;
        let isReadyToFight = false;
        
        let videoElement = document.getElementById("webcam");
        let canvasElement = document.getElementById("outputCanvas");
        let canvasCtx = canvasElement.getContext("2d");

        // Конечный автомат состояний (FSM) и переменные стабилизации
        let pushupState = 'UP'; // 'UP', 'DESCENDING', 'BOTTOM', 'ASCENDING'
        let frameCounter = 0;
        const requiredFrames = 2; // Требуемое число кадров для подтверждения состояния

        const bosses = [
            { name: "Сквернословный Орк", emoji: "👹", hp: 100 },
            { name: "Кибер-Гоблин", emoji: "👺", hp: 150 },
            { name: "Огненный Дракон", emoji: "🐉", hp: 200 }
        ];

        function initPose() {
            if (typeof Pose === "undefined") {
                document.getElementById("statusMsg").innerText = "Ошибка загрузки библиотеки. Проверьте сеть.";
                return;
            }

            pose = new Pose({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
            });

            pose.setOptions({
                modelComplexity: 1,
                smoothLandmarks: true,
                minDetectionConfidence: 0.4,
                minTrackingConfidence: 0.4
            });

            pose.onResults(onPoseResults);
            document.getElementById("statusMsg").innerText = "ИИ готов! Нажмите «Камера»";
        }

        async function toggleCamera() {
            const btn = document.getElementById("camBtn");
            const bossAvatar = document.getElementById("bossAvatar");
            const statusMsg = document.getElementById("statusMsg");

            if (webcamRunning) {
                webcamRunning = false;
                isReadyToFight = false;
                if (camera) { camera.stop(); }
                videoElement.classList.add("opacity-0");
                bossAvatar.classList.remove("opacity-0");
                statusMsg.innerText = "Камера выключена";
                btn.innerHTML = "<span>📷</span> Камера";
                document.getElementById("poseStateText").innerText = "ОТКЛ";
                return;
            }

            try {
                if (!pose) initPose();

                camera = new Camera(videoElement, {
                    onFrame: async () => {
                        if (webcamRunning && pose) {
                            await pose.send({ image: videoElement });
                        }
                    },
                    width: 640,
                    height: 480
                });

                await camera.start();
                webcamRunning = true;
                isReadyToFight = false;
                
                videoElement.classList.remove("opacity-0");
                bossAvatar.classList.add("opacity-0");
                btn.innerHTML = "<span>⏹️</span> Стоп";

                let countdown = 3;
                document.getElementById("poseStateText").innerText = "ПАУЗА";
                
                const prepInterval = setInterval(() => {
                    if (!webcamRunning) {
                        clearInterval(prepInterval);
                        return;
                    }
                    if (countdown > 0) {
                        statusMsg.innerText = `📱 Поставьте телефон! Старт через ${countdown}...`;
                        countdown--;
                    } else {
                        clearInterval(prepInterval);
                        isReadyToFight = true;
                        statusMsg.innerText = "🔥 Примите упор лёжа!";
                        document.getElementById("poseStateText").innerText = "ВЕРХ";
                        pushupState = 'UP';
                        frameCounter = 0;
                    }
                }, 1000);

            } catch (err) {
                console.error("Ошибка доступа к камере:", err);
                alert("Не удалось включить камеру. Разрешите доступ к камере в браузере.");
            }
        }

        function onPoseResults(results) {
            if (!webcamRunning) return;

            canvasElement.width = videoElement.videoWidth || 640;
            canvasElement.height = videoElement.videoHeight || 480;

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            if (results.poseLandmarks && isReadyToFight) {
                const landmarks = results.poseLandmarks;
                
                const leftShoulder = landmarks[11];
                const rightShoulder = landmarks[12];
                const leftElbow = landmarks[13];
                const rightElbow = landmarks[14];
                const leftWrist = landmarks[15];
                const rightWrist = landmarks[16];
                const leftHip = landmarks[23];
                const rightHip = landmarks[24];

                // Проверка базовой видимости плеч и рук
                const isVisible = leftShoulder && rightShoulder && leftElbow && rightElbow && leftWrist && rightWrist &&
                                  leftShoulder.visibility > 0.15 && rightShoulder.visibility > 0.15;

                if (isVisible) {
                    // НАДЁЖНАЯ ПРОВЕРКА ПЛАНКИ (Защита от сидения и тряски телефона)
                    let isPlank = false;
                    if (leftHip && rightHip && leftHip.visibility > 0.2 && rightHip.visibility > 0.2) {
                        const shoulderMidY = (leftShoulder.y + rightShoulder.y) / 2;
                        const hipMidY = (leftHip.y + rightHip.y) / 2;
                        const shoulderMidX = (leftShoulder.x + rightShoulder.x) / 2;
                        const hipMidX = (leftHip.x + rightHip.x) / 2;

                        const deltaY = Math.abs(hipMidY - shoulderMidY);
                        const deltaX = Math.abs(hipMidX - shoulderMidX);
                        const bodyAngle = Math.atan2(deltaY, deltaX) * (180 / Math.PI);

                        // Если угол тела меньше 45 градусов — корпус расположен горизонтально (упор лёжа)
                        isPlank = bodyAngle < 45;
                    } else {
                        // Если бёдра скрыты из-за близкого кадра, проверяем стабильную ширину плеч
                        const shoulderWidth = Math.abs(leftShoulder.x - rightShoulder.x);
                        isPlank = shoulderWidth > 0.22;
                    }

                    if (!isPlank) {
                        document.getElementById("statusMsg").innerText = "⚠️ ПРИНИМИТЕ УПОР ЛЁЖА!";
                        document.getElementById("poseStateText").innerText = "НЕ ПЛАНКА";
                        pushupState = 'UP';
                        frameCounter = 0;
                        canvasCtx.restore();
                        return;
                    }

                    document.getElementById("statusMsg").innerText = "🔥 Отжимайтесь!";
                    
                    // Рисуем скелет
                    drawSkeletonMesh(leftShoulder, rightShoulder, leftElbow, rightElbow, leftWrist, rightWrist);

                    // Вычисляем углы обеих рук
                    const leftAngle = calculateAngle(leftShoulder, leftElbow, leftWrist);
                    const rightAngle = calculateAngle(rightShoulder, rightElbow, rightWrist);
                    const avgAngle = (leftAngle + rightAngle) / 2;

                    // Обработка конечного автомата состояний (FSM)
                    processFSM(avgAngle);
                } else {
                    document.getElementById("statusMsg").innerText = "⚠️ Держите руки и плечи в кадре";
                    document.getElementById("poseStateText").innerText = "ПОИСК";
                }
            } else if (isReadyToFight) {
                document.getElementById("poseStateText").innerText = "НЕТ ТЕЛА";
            }
            canvasCtx.restore();
        }

        function calculateAngle(a, b, c) {
            if (!a || !b || !c) return 180;
            let radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
            let angle = Math.abs(radians * 180.0 / Math.PI);
            if (angle > 180.0) angle = 360.0 - angle;
            return angle;
        }

        function drawSkeletonMesh(ls, rs, le, re, lw, rw) {
            const color = pushupState === 'BOTTOM' || pushupState === 'DESCENDING' ? "#ef4444" : "#a855f7";

            const connections = [
                [ls, rs], // Линия плеч
                [ls, le], [le, lw], // Левая рука
                [rs, re], [re, rw]  // Правая рука
            ];

            canvasCtx.lineWidth = 4;
            canvasCtx.strokeStyle = color;

            connections.forEach(([p1, p2]) => {
                if (p1 && p2) {
                    canvasCtx.beginPath();
                    canvasCtx.moveTo(p1.x * canvasElement.width, p1.y * canvasElement.height);
                    canvasCtx.lineTo(p2.x * canvasElement.width, p2.y * canvasElement.height);
                    canvasCtx.stroke();
                }
            });

            [ls, rs, le, re, lw, rw].forEach(p => {
                if (p) {
                    canvasCtx.beginPath();
                    canvasCtx.arc(p.x * canvasElement.width, p.y * canvasElement.height, 6, 0, 2 * Math.PI);
                    canvasCtx.fillStyle = "#eab308";
                    canvasCtx.fill();
                }
            });
        }

        // Строгий конечный автомат (FSM) для точного подсчета полного цикла отжимания
        function processFSM(avgAngle) {
            const stateText = document.getElementById("poseStateText");

            switch (pushupState) {
                case 'UP':
                    stateText.innerText = "ВЕРХ";
                    stateText.className = "text-[10px] px-2 py-0.5 bg-emerald-950 text-emerald-400 rounded font-mono border border-emerald-800";
                    if (avgAngle < 110) {
                        frameCounter++;
                        if (frameCounter >= requiredFrames) {
                            pushupState = 'DESCENDING';
                            frameCounter = 0;
                        }
                    } else {
                        frameCounter = 0;
                    }
                    break;

                case 'DESCENDING':
                    stateText.innerText = "ОПУСКАНИЕ";
                    stateText.className = "text-[10px] px-2 py-0.5 bg-amber-950 text-amber-400 rounded font-mono border border-amber-800";
                    if (avgAngle <= 95) {
                        frameCounter++;
                        if (frameCounter >= requiredFrames) {
                            pushupState = 'BOTTOM';
                            frameCounter = 0;
                        }
                    } else if (avgAngle > 125) {
                        pushupState = 'UP';
                        frameCounter = 0;
                    } else {
                        frameCounter = 0;
                    }
                    break;

                case 'BOTTOM':
                    stateText.innerText = "НИЗ";
                    stateText.className = "text-[10px] px-2 py-0.5 bg-red-950 text-red-400 rounded font-mono border border-red-800";
                    if (avgAngle > 105) {
                        frameCounter++;
                        if (frameCounter >= requiredFrames) {
                            pushupState = 'ASCENDING';
                            frameCounter = 0;
                        }
                    } else {
                        frameCounter = 0;
                    }
                    break;

                case 'ASCENDING':
                    stateText.innerText = "ПОДЪЁМ";
                    stateText.className = "text-[10px] px-2 py-0.5 bg-blue-950 text-blue-400 rounded font-mono border border-blue-800";
                    if (avgAngle >= 125) {
                        frameCounter++;
                        if (frameCounter >= requiredFrames) {
                            pushupState = 'UP';
                            frameCounter = 0;
                            triggerHit(15, "ОТЖИМАНИЕ! 🔥");
                        }
                    } else if (avgAngle < 90) {
                        pushupState = 'BOTTOM';
                        frameCounter = 0;
                    } else {
                        frameCounter = 0;
                    }
                    break;
            }
        }

        function triggerHit(damageAmount = 10, customText = null) {
            if (!isReadyToFight) return;

            currentHp -= damageAmount;
            if (currentHp < 0) currentHp = 0;

            if (customText) {
                pushups++;
                document.getElementById("pushupCount").innerText = pushups;
            }

            updateBossUI();
            triggerEffects(customText || `-${damageAmount}`);

            if (currentHp === 0) {
                isReadyToFight = false;
                document.getElementById("statusMsg").innerText = "🎉 ПОБЕДА! Новый босс спешит!";
                
                setTimeout(() => {
                    bossLevel++;
                    let bossIndex = (bossLevel - 1) % bosses.length;
                    maxHp = bosses[bossIndex].hp;
                    currentHp = maxHp;

                    document.getElementById("bossName").innerText = bosses[bossIndex].emoji + " " + bosses[bossIndex].name;
                    document.getElementById("bossLevelText").innerText = "Босс уровня " + bossLevel;
                    document.getElementById("bossMaxHpText").innerText = "/ " + maxHp + " HP";
                    
                    updateBossUI();
                    isReadyToFight = true;
                    document.getElementById("statusMsg").innerText = "🔥 Бой продолжается!";
                }, 1500);
            }
        }

        function manualHit() {
            pushups++;
            document.getElementById("pushupCount").innerText = pushups;
            triggerHit(15, "-15 УДАР!");
        }

        function updateBossUI() {
            const hpBar = document.getElementById("bossHpBar");
            const hpText = document.getElementById("bossHpText");
            const percentage = (currentHp / maxHp) * 100;
            
            hpBar.style.width = percentage + "%";
            hpText.innerText = currentHp;
        }

        function triggerEffects(text) {
            const container = document.getElementById("gameContainer");
            container.classList.add("boss-shake");
            setTimeout(() => container.classList.remove("boss-shake"), 300);

            const floatCont = document.getElementById("floatingContainer");
            const dmgEl = document.createElement("div");
            dmgEl.className = "damage-float text-amber-300 text-xl";
            dmgEl.innerText = text;
            dmgEl.style.left = Math.random() * 60 + 20 + "%";
            dmgEl.style.top = Math.random() * 40 + 30 + "%";
            floatCont.appendChild(dmgEl);

            setTimeout(() => dmgEl.remove(), 800);
        }

        window.addEventListener("DOMContentLoaded", () => {
            initPose();
        });
    </script>
</body>
</html>
