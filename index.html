<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Push Battle RPG</title>
    <!-- Tailwind CSS для красивого интерфейса -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Подключаем MediaPipe Tasks Vision с надежного CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/vision_bundle.js" crossorigin="anonymous"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            touch-action: manipulation;
            overflow: hidden;
            height: 100vh;
            margin: 0;
            padding: 0;
        }
        .boss-shake {
            animation: shake 0.3s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translate(0, 0); }
            20% { transform: translate(-8px, 4px); }
            40% { transform: translate(8px, -4px); }
            60% { transform: translate(-6px, -2px); }
            80% { transform: translate(6px, 2px); }
        }
        .damage-float {
            position: absolute;
            animation: floatUp 0.8s ease-out forwards;
            pointer-events: none;
            font-weight: 900;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.8); }
            100% { opacity: 0; transform: translateY(-70px) scale(1.3); }
        }
    </style>
</head>
<body class="flex flex-col justify-between h-screen p-4 select-none">

    <!-- ВЕРХНЯЯ ЧАСТЬ: ИНФОРМАЦИЯ О БОССЕ -->
    <div class="w-full bg-slate-900/80 border border-slate-800 rounded-2xl p-4 shadow-xl backdrop-blur-md relative">
        <div class="flex justify-between items-center mb-2">
            <div>
                <h1 class="text-lg font-bold tracking-wide text-red-400">👹 Сквернословный Орк</h1>
                <p class="text-xs text-slate-400">Босс уровня 1</p>
            </div>
            <div class="text-right">
                <span id="bossHpText" class="text-xl font-black text-red-500">100</span>
                <span class="text-xs text-slate-500">/ 100 HP</span>
            </div>
        </div>

        <!-- Полоса здоровья босса -->
        <div class="w-full bg-slate-800 h-4 rounded-full overflow-hidden p-0.5 border border-slate-700/50">
            <div id="bossHpBar" class="bg-gradient-to-r from-red-600 to-amber-500 h-full rounded-full transition-all duration-300" style="width: 100%;"></div>
        </div>
    </div>

    <!-- ЦЕНТРАЛЬНАЯ ЧАСТЬ: ВИДЕО КАМЕРЫ И АВАТАР БОССА -->
    <div id="gameContainer" class="relative flex-1 my-3 flex items-center justify-center bg-slate-950 rounded-2xl overflow-hidden border border-slate-800 shadow-inner">
        <!-- Аватар босса (если камера выключена) -->
        <div id="bossAvatar" class="absolute inset-0 flex flex-col items-center justify-center p-6 text-center z-10 transition-opacity duration-300">
            <div class="w-32 h-32 bg-red-950/40 rounded-full flex items-center justify-center border-2 border-red-600/50 mb-4 shadow-[0_0_30px_rgba(239,68,68,0.2)]">
                <span class="text-6xl">👹</span>
            </div>
            <p id="statusMsg" class="text-sm text-slate-400 font-medium max-w-[260px]">Нажмите «Включить камеру» или используйте тестовый удар</p>
        </div>

        <!-- Видеопоток с камеры -->
        <video id="webcam" autoplay playsinline muted class="absolute inset-0 w-full h-full object-cover transform -scale-x-100 opacity-0 transition-opacity duration-500"></video>
        
        <!-- Холст для скелета ИИ -->
        <canvas id="outputCanvas" class="absolute inset-0 w-full h-full object-cover transform -scale-x-100 pointer-events-none z-20"></canvas>

        <!-- Контейнер для вылетающего урона -->
        <div id="floatingContainer" class="absolute inset-0 pointer-events-none z-30 overflow-hidden"></div>
    </div>

    <!-- НИЖНЯЯ ПАНЕЛЬ: СЧЁТЧИК И УПРАВЛЕНИЕ -->
    <div class="w-full bg-slate-900/80 border border-slate-800 rounded-2xl p-4 shadow-xl backdrop-blur-md flex flex-col gap-3">
        
        <!-- Статистика отжиманий -->
        <div class="flex justify-between items-center bg-slate-950/50 px-4 py-2.5 rounded-xl border border-slate-800/80">
            <div class="flex items-center gap-2">
